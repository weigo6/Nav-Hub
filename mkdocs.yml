site_name: 云渡书舟
repo_url: https://github.com/weigo6/suffine-hub
repo_name: Weigo6/Suffine-Hub
copyright: >
  &copy; Copyright 2026 Luwei

hooks:
  - hooks.py

extra_css:
  - stylesheets/extra.css

theme:
  name: materialx
  logo: images/logo.png
  favicon: images/internet.png
  language: zh
  features:
    - navigation.top
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/theme-light-dark
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference

extra:
  generator: true
  social:
    - icon: fontawesome/brands/weixin
      link: "https://bucket.rutno.com/d?sid=eqtRzdKfuGlmIm2wX3IwXffreqnr&e=1769434119&sig=aca3206c8defbfd303f1c5b6b36f51416243315723ae7e667fc98f7a5bf29111"
      name: 关注微信公众号
    - icon: fontawesome/brands/discord
      link: "https://discord.gg/fSvCWA9say"
      name: 加入 Discord 服务器
    - icon: fontawesome/brands/github
      link: "https://github.com/weigo6"
      name: 访问 GitHub 主页
    - icon: simple/gitee
      link: "https://gitee.com/weigo6"
      name: 访问 Gitee 主页
    - icon: fontawesome/brands/bilibili
      link: "https://space.bilibili.com/512710834"
      name: 访问 Bilibili 主页
    - icon: simple/gmail
      link: "mailto:yang92636@qq.com"
      name: 通过电子邮件联系我

markdown_extensions:
  # 基础扩展
  - attr_list
  - md_in_html
  - toc:
      permalink: true

  # PyMdown Extensions (MD拓展语法)
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg